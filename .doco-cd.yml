# Production (keeper.goodmanners.services): bind-mount data under /opt/stacks/.
# Stack secrets live in git as stacks/*/secrets.enc.env (SOPS + age).
# Doco-CD decrypts env_files at deploy time; age key stays on the host only.
# MAX_CONCURRENT_DEPLOYMENTS=1 serializes deploys in list order.

---
name: hcloud-traefik
working_dir: stacks/traefik
webhook_filter: ^refs/heads/main$
compose_files:
  - docker-compose.yaml
env_files:
  - secrets.enc.env

