version: 1
metadata:
  labels:
    blueprints.goauthentik.io/instantiate: "true"
  name: 050 Poweradmin OIDC
entries:
  - id: poweradmin-admin-group
    model: authentik_core.group
    state: present
    identifiers:
      name: poweradmin-admin
    attrs:
      name: poweradmin-admin

  - id: poweradmin-viewer-group
    model: authentik_core.group
    state: present
    identifiers:
      name: poweradmin-viewer
    attrs:
      name: poweradmin-viewer

  - id: poweradmin-access-policy
    model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: poweradmin-access
    attrs:
      name: poweradmin-access
      expression: |
        return (
          ak_is_group_member(request.user, name="poweradmin-admin")
          or ak_is_group_member(request.user, name="poweradmin-viewer")
          or ak_is_group_member(request.user, name="platform-admin")
        )

  # Same claim as Keeper; upsert by scope_name if 020 already created it.
  - id: poweradmin-groups-scope
    model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      scope_name: groups
    attrs:
      name: OIDC groups
      scope_name: groups
      description: Group names for OIDC RBAC
      expression: |
        return [group.name for group in user.ak_groups.all()]

  - id: poweradmin-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Poweradmin
    attrs:
      name: Poweradmin
      client_type: confidential
      client_id: poweradmin
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_username
      authorization_flow: !Find
        [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find
        [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find
        [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf poweradmin-groups-scope
      redirect_uris:
        - url: https://poweradmin.goodmanners.services/oidc/callback
          matching_mode: strict

  - id: poweradmin-application
    model: authentik_core.application
    state: present
    identifiers:
      slug: poweradmin
    attrs:
      name: Poweradmin
      slug: poweradmin
      meta_launch_url: https://poweradmin.goodmanners.services
      policy_engine_mode: any
      provider: !KeyOf poweradmin-provider

  - id: poweradmin-access-binding
    model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, poweradmin]]
      policy: !Find
        [authentik_policies_expression.expressionpolicy, [name, poweradmin-access]]
    attrs:
      enabled: true
      order: 0
