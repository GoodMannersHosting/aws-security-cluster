version: 1
metadata:
  labels:
    blueprints.goauthentik.io/instantiate: "true"
  name: 020 Keeper OpenBao SSO
entries:
  - id: keeper-groups-scope
    model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      scope_name: groups
    attrs:
      name: OIDC groups
      scope_name: groups
      description: Group names for OpenBao OIDC RBAC
      expression: |
        return [group.name for group in user.ak_groups.all()]

  - id: keeper-admin-group
    model: authentik_core.group
    state: present
    identifiers:
      name: keeper-admin
    attrs:
      name: keeper-admin

  - id: keeper-reader-group
    model: authentik_core.group
    state: present
    identifiers:
      name: keeper-reader
    attrs:
      name: keeper-reader

  - id: keeper-operator-group
    model: authentik_core.group
    state: present
    identifiers:
      name: keeper-operator
    attrs:
      name: keeper-operator

  - id: keeper-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Keeper OpenBao
    attrs:
      name: Keeper OpenBao
      client_type: confidential
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_username
      authorization_flow: !Find
        [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find
        [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find
        [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find
          [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf keeper-groups-scope
      redirect_uris:
        - url: https://keeper.goodmanners.services/ui/vault/auth/oidc/oidc/callback
          matching_mode: strict
        - url: https://keeper.goodmanners.services/v1/auth/oidc/oidc/callback
          matching_mode: strict
        - url: https://keeper.goodmanners.services/v1/auth/oidc/callback
          matching_mode: strict
        - url: http://localhost:8250/oidc/callback
          matching_mode: strict

  - id: keeper-application
    model: authentik_core.application
    state: present
    identifiers:
      slug: keeper
    attrs:
      name: Keeper
      slug: keeper
      policy_engine_mode: any
      provider: !KeyOf keeper-provider
