name: doco-cd

services:
  app:
    image: ghcr.io/kimdre/doco-cd:${DOCO_CD_TAG:-0.90.1}
    container_name: doco-cd
    restart: unless-stopped
    env_file:
      - ${DOCO_CD_ENV_FILE:-/opt/stacks/doco-cd/.env}
    environment:
      HTTP_PORT: "80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks:ro
      - doco_cd_data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.services.doco-cd.loadbalancer.server.port=80
      # GitHub/GitLab webhooks cannot pass Authentik forward auth.
      - traefik.http.routers.doco-cd-webhook.rule=Host(`${DOCO_CD_HOSTNAME}`) && PathPrefix(`/v1/webhook`)
      - traefik.http.routers.doco-cd-webhook.entrypoints=websecure
      - traefik.http.routers.doco-cd-webhook.tls=true
      - traefik.http.routers.doco-cd-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.doco-cd-webhook.priority=100
      - "traefik.http.routers.doco-cd-webhook.middlewares=ratelimit-webhook@file,security-headers@file"
      - traefik.http.routers.doco-cd-webhook.service=doco-cd
      - traefik.http.routers.doco-cd.rule=Host(`${DOCO_CD_HOSTNAME}`)
      - traefik.http.routers.doco-cd.entrypoints=websecure
      - traefik.http.routers.doco-cd.tls=true
      - traefik.http.routers.doco-cd.tls.certresolver=letsencrypt
      - traefik.http.routers.doco-cd.priority=1
      - "traefik.http.routers.doco-cd.middlewares=forward-auth-authentik@file,security-headers@file"
      - traefik.http.routers.doco-cd.service=doco-cd
    security_opt:
      - no-new-privileges:true

networks:
  traefik:
    external: true

volumes:
  doco_cd_data:
