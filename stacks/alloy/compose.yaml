name: hcloud-alloy

services:
  alloy:
    image: grafana/alloy:${ALLOY_TAG:-v1.12.2}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    env_file:
      - secrets.enc.env
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 &&
          head -n1 <&3 | grep -q "200"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  traefik:
    external: true

volumes:
  alloy_data:
