http:
  middlewares:
    compress:
      compress: {}
    ratelimit-openbao:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
    ratelimit-powerdns:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
    ratelimit-webhook:
      rateLimit:
        average: 5
        burst: 10
        period: 1m
    forward-auth-authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
