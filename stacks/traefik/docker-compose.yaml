networks:
  traefik:
    name: traefik
    external: false

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    networks:
      - traefik
    environment:
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      INFO: 1
      POST: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: false
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run

  traefik:
    image: traefik:${TRAEFIK_TAG:-v3}
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    networks:
      - traefik
    ports:
      - "80:80"
      - "443:443"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ${TRAEFIK_CONFIG_PATH:-./traefik.yml}:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_DYNAMIC_PATH:-./dynamic}:/etc/traefik/dynamic:ro
      - ${TRAEFIK_LOG_DIR:-/var/log/traefik}:/var/log/traefik
      - ${TRAEFIK_ACME_DIR:-./acme}:/acme
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8082"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_HOSTNAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.middlewares=forward-auth-authentik@file,chain-default@file"
      - "cd.doco.deployment.recreate.ignore={bindMounts: [/acme, /var/log/traefik]}"
