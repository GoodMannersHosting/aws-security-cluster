name: powerdns

services:
  postgresql:
    image: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: powerdns-postgresql
    restart: unless-stopped
    env_file:
      - secrets.enc.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB:-pdns}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${POWERDNS_POSTGRES_DATA:-/mnt/data/postgres/powerdns}:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - powerdns
    security_opt:
      - no-new-privileges:true

  authoritative:
    image: docker.io/powerdns/pdns-auth-51:5.1.3@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    container_name: powerdns-authoritative
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - secrets.enc.env
    # Image ENTRYPOINT is pdns_server-startup; override so we control startup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec pdns_server \
          --config-dir=/etc/powerdns \
          --api-key="$${PDNS_AUTH_API_KEY}" \
          --webserver-password="$${PDNS_AUTH_WEB_KEY}" \
          --gpgsql-dbname="$${POSTGRES_DB}" \
          --gpgsql-user="$${POSTGRES_USER}" \
          --gpgsql-password="$${POSTGRES_PASS}"
    healthcheck:
      test:
        - CMD-SHELL
        - pdns_control rping
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:uid=953,gid=953,mode=1777
      - /var/run/pdns:uid=953,gid=953,mode=0755
    volumes:
      - ./pdns.conf:/etc/powerdns/pdns.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - powerdns
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.powerdns.rule=Host(`${POWERDNS_API_HOSTNAME}`)
      - traefik.http.routers.powerdns.entrypoints=websecure
      - traefik.http.routers.powerdns.tls=true
      - traefik.http.routers.powerdns.tls.certresolver=letsencrypt
      - traefik.http.routers.powerdns.middlewares=ratelimit-powerdns@file,security-headers@file
      - traefik.http.services.powerdns.loadbalancer.server.port=8081
      - traefik.tcp.routers.powerdns-dns-tcp.entrypoints=dns-tcp
      - traefik.tcp.routers.powerdns-dns-tcp.rule=HostSNI(`*`)
      - traefik.tcp.routers.powerdns-dns-tcp.service=powerdns-dns-tcp
      - traefik.tcp.services.powerdns-dns-tcp.loadbalancer.server.port=53
      - traefik.udp.routers.powerdns-dns-udp.entrypoints=dns-udp
      - traefik.udp.routers.powerdns-dns-udp.service=powerdns-dns-udp
      - traefik.udp.services.powerdns-dns-udp.loadbalancer.server.port=53

networks:
  powerdns:
    driver: bridge
  traefik:
    external: true
